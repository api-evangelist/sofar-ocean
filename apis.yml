aid: sofar-ocean
name: Sofar Ocean
description: >-
  Sofar Ocean operates one of the world's largest privately owned networks of
  real-time ocean weather sensors. Its Spotter buoys and Smart Mooring subsurface
  sensors stream wave, wind, sea-surface temperature, barometric pressure, and
  acoustic data via cellular and satellite telemetry, and the Wayfinder platform
  turns that data into maritime voyage optimization. The Sofar API (Spotter &
  Smart Mooring plus the Operational Wave Spectra forecast) gives developers
  token-authenticated access to device telemetry, historical and geospatial data
  queries, subsurface sensor readings, NetCDF wave-spectra forecasts, and outbound
  data-forwarding webhooks.
